<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="styles.css"> <!-- تأكد أن هذا الملف يحتوي التنسيق العام للموقع -->
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background-color: #4b4b4b;
      padding: 40px;
    }

    .checkout-container {
      max-width: 500px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .checkout-container h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #695a00;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #a58f13;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <h2>Cash on Delivery</h2>
    <form action="https://formsubmit.co/electomars0@gmail.com" method="POST">
      <input type="hidden" name="_next" value="success.html">
      <input type="hidden" name="_captcha" value="false">
      <label for="fullname">Full Name</label>
      <input type="text" name="fullname" id="fullname" required>

      <label for="phone">Phone Number</label>
      <input type="tel" name="phone" id="phone" required>

      <label for="address">Shipping Address</label>
      <textarea name="address" id="address" rows="4" required></textarea>

      <input type="hidden" name="payment_method" value="Cash on Delivery">

      <button type="submit">Place Order</button>
    </form>
    
    
  </div>

</body>
</html>
