<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
          opacity: 1;
          transition: opacity 0.3s ease;
        }
      
        body.fade-out {
          opacity: 0;
        }
      </style>
      
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="products">
            <div class="product-card">
                <img src="images/images10.jpg" alt="Product 1">
                <h3>Bluetooth airpods Lenovo</h3>
                <p>139.99DH</p>
              <a href="checkout.html">
                <button>Buy Now</button>
              </a>
            </div>

            <div class="product-card">
                <img src="images/ima11ges.jpg" alt="Product 2">
                <h3>Q6 LED starry projector light</h3>
                <p>89.99DH</p>
              <a href="checkout.html"> 
                <button>Buy Now</button>
              </a>  
            </div>
        
            <!-- كرر المزيد حسب عدد المنتجات -->
        </div>
        
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>

    <div class="container">
        <h1>Our Products</h1>
        <p>We offer high-quality items just for you.</p>
    </div>
    <script>
        document.querySelectorAll("a").forEach(link => {
          link.addEventListener("click", function (e) {
            const href = link.getAttribute("href");
            if (href && !href.startsWith("#") && !href.startsWith("javascript")) {
              e.preventDefault();
              document.body.classList.add("fade-out");
              setTimeout(() => {
                window.location.href = href;
              }, 500);
            }
          });
        });
      </script>
      
</body>
</html>
